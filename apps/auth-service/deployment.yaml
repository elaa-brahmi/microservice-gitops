apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        # Placeholder: CI will replace 'latest' with the Git SHA
        image: prodmicroserviceplatformregistry.azurecr.io/auth-service:a6b667f140cc189e824fbb637a5813626c802206
        imagePullPolicy: Always
      imagePullSecrets:
      - name: acr-pull-secret
        ports:
        - containerPort: 3000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        # Placeholder: CI will replace 'latest' with the Git SHA
        image: <YOUR_ACR_NAME>.azurecr.io/auth-service:latest 
        ports:
        - containerPort: 3000
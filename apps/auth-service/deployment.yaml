apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        # Placeholder: CI will replace 'latest' with the Git SHA
        image: prodmicroserviceplatformregistry.azurecr.io/auth-service:58675053bd7082b993ab8324b04df54140a4b5ec
        imagePullPolicy: Always
      imagePullSecrets:
      - name: acr-pull-secret
        ports:
        - containerPort: 3000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: prodmicroserviceplatformregistry.azurecr.io/gateway:e04b6b590a1750c8d17bdb4fbe67e0b351538980
        imagePullPolicy: Always
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service.default.svc.cluster.local:80"
        - name: TASKS_SERVICE_URL
          value: "http://tasks-service.default.svc.cluster.local:80"
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health   # Ensure your app has this endpoint!
            port: 3000
          initialDelaySeconds: 5  # Wait 5s after start to check
          periodSeconds: 10       # Check every 10s
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15 # Give it more time before killing it
          periodSeconds: 20
      imagePullSecrets:
      - name: acr-pull-secret
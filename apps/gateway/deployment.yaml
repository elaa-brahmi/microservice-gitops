apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: prodmicroserviceplatformregistry.azurecr.io/gateway:f66f49b18874aac274806de2de5f3ddd6073d7f3
        imagePullPolicy: Always
      imagePullSecrets:
      - name: acr-pull-secret
        ports:
        - containerPort: 80
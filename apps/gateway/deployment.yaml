apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: prodmicroserviceplatformregistry.azurecr.io/gateway:3ea3b30386ee8fdfdef9c39693b930732052fd24
        imagePullPolicy: Always
      imagePullSecrets:
      - name: acr-pull-secret
        ports:
        - containerPort: 80
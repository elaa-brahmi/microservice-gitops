apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice-ingress-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /tasks
        pathType: Prefix
        backend:
          service:
            name: tasks-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80
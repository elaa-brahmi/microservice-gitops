apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-service
  labels:
    app: tasks-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasks-service
  template:
    metadata:
      labels:
        app: tasks-service
    spec:
      containers:
      - name: tasks-service
        image: prodmicroserviceplatformregistry.azurecr.io/tasks-service:e7f44b75fc6ba1ec3da69708792aa80f43b666ad
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
      imagePullSecrets:
      - name: acr-pull-secret